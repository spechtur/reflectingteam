<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c7d200">
<title>Reflecting Team · Kurzberatung</title>
<style>
  :root{
    --bg:#c7d200;
    --fg:#2b2b2b;
    --sans:'DejaVu Sans','Verdana','Tahoma',sans-serif;
    --serif:'DejaVu Serif',Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg);color:var(--fg);font-family:var(--sans);
    transition:background .55s ease,color .55s ease;
    -webkit-font-smoothing:antialiased;
  }
  body.idle{cursor:none}

  .screen{
    position:fixed;inset:0;display:flex;flex-direction:column;overflow-y:auto;
    padding:max(3vh,env(safe-area-inset-top)) 5vw max(3vh,env(safe-area-inset-bottom));
  }
  .screen[hidden]{display:none}

  /* ---------- Buttons ---------- */
  .btn{
    font:800 clamp(1rem,1.9vw,2.6rem) var(--sans);
    text-transform:uppercase;letter-spacing:.08em;
    padding:.8em 1.4em;border:.14em solid var(--fg);border-radius:.45em;
    background:var(--fg);color:var(--bg);cursor:pointer;
    transition:transform .15s ease,opacity .2s ease,background .55s ease,color .55s ease,border-color .55s ease;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--fg);opacity:.75}
  .btn.ghost:hover{opacity:1}
  .btn:focus-visible{outline:.2em solid var(--fg);outline-offset:.2em}

  /* ---------- Startseite ---------- */
  #start{gap:3vh;padding-bottom:max(5vh,calc(env(safe-area-inset-bottom) + 24px))}
  .logo{display:flex;align-items:baseline;gap:.15em;line-height:1}
  .logo .ph{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;font-size:clamp(2.2rem,3.6vw,5rem)}
  .logo .gr{font-family:var(--sans);font-variant:small-caps;font-weight:300;font-size:clamp(1.8rem,3vw,4.2rem);letter-spacing:.03em}
  .start-main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2.4vh;max-width:88vw}
  .kicker{font-weight:800;text-transform:uppercase;letter-spacing:.2em;font-size:clamp(.8rem,1.7vw,2.4rem);opacity:.8}
  .title{
    font-weight:800;text-transform:uppercase;letter-spacing:.02em;line-height:1.02;
    font-size:min(8vw,18vh);
    display:inline-block;align-self:flex-start;
    border-bottom:.07em solid var(--fg);padding-bottom:.06em;
  }
  .lead{font-family:var(--serif);font-style:italic;font-size:clamp(1.15rem,2.6vw,3.6rem);line-height:1.3;max-width:80vw;text-wrap:balance}
  .ov{list-style:none;max-width:min(88vw,46rem);display:flex;flex-direction:column}
  .ov li{
    display:flex;align-items:center;gap:1em;padding:.55em 0;
    border-bottom:2px solid color-mix(in srgb,var(--fg) 25%,transparent);
    font-size:clamp(1rem,1.7vw,2.3rem);
  }
  .ov li:last-child{border-bottom:none}
  .ov .n{
    font-weight:800;letter-spacing:.06em;font-size:.8em;
    border:.14em solid var(--fg);border-radius:.4em;padding:.1em .5em;
  }
  .ov .nm{flex:1;font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.9em}
  .ov .tm{font-variant-numeric:tabular-nums;opacity:.7;font-weight:700}
  .start-foot{display:flex}
  .strip{position:fixed;left:0;right:0;bottom:0;height:max(1.4vh,8px);display:flex}
  .strip span{flex:1}

  /* ---------- Phase ---------- */
  #phase{gap:2vh}
  .top{display:flex;align-items:center;gap:1.6vw;padding-right:4.4rem;font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:clamp(.8rem,1.55vw,2.2rem)}
  .top .num{border:.14em solid var(--fg);border-radius:.4em;padding:.15em .55em;letter-spacing:.06em;transition:border-color .55s ease}
  .top .count{margin-left:auto;opacity:.65;letter-spacing:.08em;white-space:nowrap}
  .stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2.2vh;min-height:0}
  .who{
    font-weight:800;line-height:1.08;letter-spacing:-.012em;text-wrap:balance;
    font-size:clamp(1.9rem,6vw,7rem);max-width:88vw;
  }
  .who::before{content:"";display:block;width:14vw;max-width:8rem;height:max(1.1vh,8px);background:var(--fg);margin-bottom:2vh;border-radius:99px;transition:background .55s ease}
  .who.in,.desc.in{animation:rise .45s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(2vh)}to{opacity:1;transform:none}}
  .desc{font-family:var(--serif);font-style:italic;font-size:clamp(1.05rem,2.3vw,3.2rem);line-height:1.3;max-width:80vw;text-wrap:balance}

  .clockbox{display:flex;flex-direction:column;gap:1.2vh;margin-top:1vh}
  .clock{
    font-weight:800;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em;
    font-size:min(26vw,24vh);
  }
  .status{font-weight:800;text-transform:uppercase;letter-spacing:.2em;font-size:clamp(.8rem,1.5vw,2rem);opacity:.75}
  .meter{position:relative;height:max(1.1vh,10px);border-radius:99px;overflow:hidden}
  .meter::before{content:"";position:absolute;inset:0;background:var(--fg);opacity:.18}
  .meter i{position:absolute;inset:0;background:var(--fg);transform-origin:left;transition:transform .25s linear}
  body.over .clock{animation:blink 1s steps(2,start) infinite}
  body.over .status{opacity:1}
  @keyframes blink{50%{opacity:.35}}

  .dots{display:flex;align-items:center;justify-content:center;gap:1.2vw}
  .dot{width:.85vw;height:.85vw;min-width:10px;min-height:10px;border-radius:50%;border:2px solid var(--fg);opacity:.35;transition:all .3s ease}
  .dot.done{background:var(--fg);opacity:.6}
  .dot.cur{background:var(--fg);opacity:1;transform:scale(1.6)}

  .ctrl{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .nav{display:flex;gap:12px}
  .nav .grow{flex:1}

  /* ---------- Schluss ---------- */
  #end{justify-content:center;gap:4vh}
  #end .big{font-weight:800;font-size:min(10vw,16vh);line-height:1.05;text-wrap:balance;max-width:88vw}
  #end .sub{font-family:var(--serif);font-style:italic;font-size:clamp(1.2rem,3vw,4.2rem);line-height:1.25;max-width:75vw}
  #end .btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:1vh}

  /* ---------- Vollbild-Schalter ---------- */
  #fs{
    position:fixed;top:max(12px,env(safe-area-inset-top));right:14px;z-index:20;
    width:3.2rem;height:3.2rem;border-radius:.6rem;
    border:2px solid var(--fg);background:transparent;color:var(--fg);
    font:700 1.5rem var(--sans);cursor:pointer;opacity:.75;
    transition:opacity .3s ease,color .55s ease,border-color .55s ease;
  }
  #fs:hover{opacity:1}
  body.idle #fs{opacity:0;pointer-events:none}

  @media (max-width:700px){
    .title{font-size:min(10.5vw,12vh)}
    .lead{max-width:88vw}
  }
  @media (prefers-reduced-motion:reduce){
    .who.in,.desc.in,body.over .clock{animation:none}
  }
</style>
</head>
<body>

<button id="fs" type="button" title="Vollbild (F)" aria-label="Vollbild umschalten">⛶</button>

<!-- STARTSEITE -->
<section class="screen" id="start">
  <div class="logo" aria-label="phGR"><span class="ph">ph</span><span class="gr">GR</span></div>
  <div class="start-main">
    <div class="kicker">Kollegiale Kurzberatung · 3 Personen</div>
    <h1 class="title">Reflecting Team</h1>
    <p class="lead" id="lead"></p>
    <ul class="ov" id="ov"></ul>
  </div>
  <div class="start-foot">
    <button class="btn" id="btnStart" type="button">Start&nbsp;→</button>
  </div>
  <div class="strip" id="strip"></div>
</section>

<!-- PHASE -->
<section class="screen" id="phase" hidden>
  <div class="top">
    <span class="num" id="num">01</span>
    <span id="cat">Phase</span>
    <span class="count" id="count">1 / 4</span>
  </div>
  <div class="stage">
    <div class="who" id="who"></div>
    <p class="desc" id="desc"></p>
    <div class="clockbox">
      <div class="clock" id="clock">0:00</div>
      <div class="meter" aria-hidden="true"><i id="meter"></i></div>
      <div class="status" id="status"></div>
    </div>
  </div>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <div class="ctrl">
    <button class="btn ghost" id="btnToggle" type="button">Pause</button>
    <button class="btn ghost" id="btnPlus" type="button">+ 30 Sek.</button>
  </div>
  <div class="nav">
    <button class="btn ghost" id="btnBack" type="button" aria-label="Zurück">←</button>
    <button class="btn grow" id="btnNext" type="button">Weiter&nbsp;→</button>
  </div>
</section>

<!-- SCHLUSS -->
<section class="screen" id="end" hidden>
  <div class="big">Danke euch dreien.</div>
  <p class="sub">Vielleicht Rollen tauschen: Wer bringt jetzt einen Fall mit?</p>
  <div class="btns">
    <button class="btn" id="btnAgain" type="button">Nochmals</button>
    <button class="btn ghost" id="btnHome" type="button">Zur Startseite</button>
  </div>
</section>

<script>
(function(){
  'use strict';

  /* ===== Phasen: Name, Rolle, Dauer in Sekunden, Farbfeld, Anweisung ===== */
  var PHASES = [
    { name:'Fall schildern',  who:'A erzählt',        secs:120, bg:'#23b2c6', fg:'#1c1c1c',
      desc:'A schildert den Fall und die Frage dahinter. B und C hören nur zu.' },
    { name:'Rückfragen',      who:'B und C fragen',   secs:60,  bg:'#fbb900', fg:'#1c1c1c',
      desc:'Nur Verständnisfragen. Keine Lösungsvorschläge, keine Bewertungen.' },
    { name:'Reflecting Team', who:'B und C sprechen', secs:180, bg:'#ed6a69', fg:'#1c1c1c',
      desc:'A dreht sich weg und hört nur zu. B und C besprechen Hypothesen, Ideen und mögliche Lösungen.' },
    { name:'Mitnehmen',       who:'A erzählt',        secs:60,  bg:'#6169af', fg:'#ffffff',
      desc:'A sagt, was er oder sie aus dem Gespräch von B und C mitnimmt.' }
  ];
  var HOME = { bg:'#c7d200', fg:'#2b2b2b' };
  var END  = { bg:'#3a3a3a', fg:'#ffffff' };

  /* ===== Helfer ===== */
  var $ = function(id){ return document.getElementById(id); };
  var root = document.documentElement;
  function pad(n){ return (n<10?'0':'')+n; }
  function fmt(sec){ var m=Math.floor(sec/60), s=sec%60; return m+':'+pad(s); }
  function label(secs){ return secs%60===0 ? (secs/60)+' Min.' : fmt(secs)+' Min.'; }
  function theme(c){ root.style.setProperty('--bg',c.bg); root.style.setProperty('--fg',c.fg);
    var m=document.querySelector('meta[name=theme-color]'); if(m) m.setAttribute('content',c.bg); }
  function show(id){ ['start','phase','end'].forEach(function(s){ $(s).hidden = (s!==id); }); }

  /* ===== Startseite aufbauen ===== */
  var totalSecs = PHASES.reduce(function(a,p){ return a+p.secs; },0);
  $('lead').textContent = 'A schildert einen Fall, B und C denken laut weiter, und A hört nur zu. In rund '
    + Math.round(totalSecs/60) + ' Minuten entstehen neue Perspektiven.';
  PHASES.forEach(function(p,i){
    var li=document.createElement('li');
    li.innerHTML='<span class="n">'+pad(i+1)+'</span><span class="nm"></span><span class="tm"></span>';
    li.querySelector('.nm').textContent=p.name;
    li.querySelector('.tm').textContent=label(p.secs);
    $('ov').appendChild(li);
    var s=document.createElement('span'); s.style.background=p.bg; $('strip').appendChild(s);
    var d=document.createElement('span'); d.className='dot'; $('dots').appendChild(d);
  });

  /* ===== Timer ===== */
  var idx=-1, total=0, remaining=0, running=false, endAt=0, tick=null, alerted=false;
  var wakeLock=null, audioCtx=null;

  function beep(){
    try{
      audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      [0,.25,.5].forEach(function(d){
        var o=audioCtx.createOscillator(), g=audioCtx.createGain();
        o.frequency.value=880; o.connect(g); g.connect(audioCtx.destination);
        var t=audioCtx.currentTime+d;
        g.gain.setValueAtTime(.0001,t);
        g.gain.exponentialRampToValueAtTime(.35,t+.02);
        g.gain.exponentialRampToValueAtTime(.0001,t+.2);
        o.start(t); o.stop(t+.22);
      });
    }catch(e){}
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
  }
  function lock(){ try{ if('wakeLock' in navigator && !wakeLock){
      navigator.wakeLock.request('screen').then(function(l){ wakeLock=l; l.addEventListener('release',function(){ wakeLock=null; }); }).catch(function(){});
  } }catch(e){} }
  function unlock(){ try{ if(wakeLock) wakeLock.release(); }catch(e){} wakeLock=null; }
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible' && idx>=0 && idx<PHASES.length) lock();
  });

  function render(){
    var over = remaining<=0;
    var sec = over ? Math.floor(-remaining/1000) : Math.ceil(remaining/1000);
    $('clock').textContent = (over?'+':'') + fmt(sec);
    $('status').textContent = over ? 'Zeit ist um' : (running ? 'läuft' : 'pausiert');
    document.body.classList.toggle('over', over);
    var frac = Math.max(0,Math.min(1,remaining/total));
    $('meter').style.transform = 'scaleX('+frac+')';
    $('btnToggle').textContent = running ? 'Pause' : 'Weiter';
  }
  function loop(){
    remaining = endAt - Date.now();
    if(remaining<=0 && !alerted){ alerted=true; beep(); }
    render();
  }
  function startTimer(){
    if(running) return;
    running=true; endAt=Date.now()+remaining;
    clearInterval(tick); tick=setInterval(loop,200); render();
  }
  function stopTimer(){
    running=false; clearInterval(tick);
    remaining=endAt-Date.now(); render();
  }
  function plus30(){
    if(remaining<=0){            // Zeit war schon um: frische 30 Sekunden
      remaining=30000; total=30000; alerted=false;
    } else {
      remaining+=30000; total+=30000;
    }
    if(running){ endAt=Date.now()+remaining; } else { startTimer(); }
    render();
  }

  /* ===== Navigation ===== */
  function go(i){
    clearInterval(tick); running=false; alerted=false;
    document.body.classList.remove('over');
    idx=i;
    if(i<0){ theme(HOME); show('start'); unlock(); return; }
    if(i>=PHASES.length){ theme(END); show('end'); unlock(); return; }
    var p=PHASES[i];
    theme(p); show('phase'); lock();
    $('num').textContent=pad(i+1);
    $('cat').textContent=p.name;
    $('count').textContent=(i+1)+' / '+PHASES.length;
    $('who').textContent=p.who;
    $('desc').textContent=p.desc;
    ['who','desc'].forEach(function(id){ var el=$(id); el.classList.remove('in'); void el.offsetWidth; el.classList.add('in'); });
    var dots=$('dots').children;
    for(var k=0;k<dots.length;k++){
      dots[k].classList.toggle('done',k<i);
      dots[k].classList.toggle('cur',k===i);
    }
    $('btnNext').innerHTML = (i===PHASES.length-1) ? 'Abschliessen&nbsp;→' : 'Weiter&nbsp;→';
    total=remaining=p.secs*1000;
    render(); startTimer();
  }
  function next(){ if(idx<PHASES.length) go(idx+1); }
  function prev(){ if(idx>=0) go(idx-1); }

  function bind(id,fn){
    $(id).addEventListener('click',function(e){
      // Audio durch Nutzer-Geste freischalten
      try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.resume) audioCtx.resume(); }catch(err){}
      fn(); e.currentTarget.blur();
    });
  }
  bind('btnStart',function(){ go(0); });
  bind('btnNext',next);
  bind('btnBack',prev);
  bind('btnToggle',function(){ running ? stopTimer() : startTimer(); });
  bind('btnPlus',plus30);
  bind('btnAgain',function(){ go(0); });
  bind('btnHome',function(){ go(-1); });

  document.addEventListener('keydown',function(e){
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    var k=e.key, inPhase = idx>=0 && idx<PHASES.length;
    if(k==='ArrowRight'||k==='PageDown'||k==='Enter'){
      e.preventDefault(); if(document.activeElement) document.activeElement.blur(); if(idx<PHASES.length) next();
    } else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){
      e.preventDefault(); prev();
    } else if(k===' ' && inPhase){
      e.preventDefault(); running ? stopTimer() : startTimer();
    } else if((k==='+'||k==='p'||k==='P') && inPhase){
      plus30();
    } else if(k==='f'||k==='F'){
      toggleFS();
    } else if(k==='Home'){
      go(-1);
    }
  });

  /* ===== Vollbild ===== */
  var fsBtn=$('fs');
  function inFS(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); }
  function toggleFS(){
    var el=document.documentElement;
    if(!inFS()){ (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el); }
    else{ (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document); }
  }
  function fsUpdate(){ fsBtn.textContent = inFS() ? '×' : '⛶'; }
  fsBtn.addEventListener('click',function(e){ toggleFS(); e.currentTarget.blur(); });
  ['fullscreenchange','webkitfullscreenchange'].forEach(function(ev){ document.addEventListener(ev,fsUpdate); });

  /* Vollbild-Schalter und Mauszeiger nach 3 s Ruhe ausblenden */
  var idleTimer;
  function wake(){
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer=setTimeout(function(){ document.body.classList.add('idle'); },3000);
  }
  document.addEventListener('mousemove',wake);
  document.addEventListener('mousedown',wake);
  wake();

  go(-1);
})();
</script>
</body>
</html>
